esphome:
  name: sauna
  on_boot:
    priority: -100
    then:
      - delay: 5s
      - button.press: btn_power   # auto power-on at startup

esp32:
  board: esp32dev

wifi:
  ssid: "YOUR_SSID"
  password: "YOUR_PASSWORD"

web_server:
  port: 80
api:
ota:
  platform: esphome

output:
  - {platform: gpio, pin: GPIO16, id: o_power}
  - {platform: gpio, pin: GPIO17, id: o_tup}
  - {platform: gpio, pin: GPIO18, id: o_tdn}
  - {platform: gpio, pin: GPIO19, id: o_hup}
  - {platform: gpio, pin: GPIO21, id: o_hdn}
  - {platform: gpio, pin: GPIO22, id: o_in}
  - {platform: gpio, pin: GPIO23, id: o_out}

button:
  - {platform: output, name: "Power",   id: btn_power, output: o_power, duration: 400ms}
  - {platform: output, name: "Temp +",  output: o_tup, duration: 300ms}
  - {platform: output, name: "Temp -",  output: o_tdn, duration: 300ms}
  - {platform: output, name: "Time +",  output: o_hup, duration: 300ms}
  - {platform: output, name: "Time -",  output: o_hdn, duration: 300ms}
  - {platform: output, name: "Inside light",  output: o_in,  duration: 300ms}
  - {platform: output, name: "Outside light", output: o_out, duration: 300ms}